version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: constructora_db
    restart: always
    environment:
      POSTGRES_DB: constructora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: