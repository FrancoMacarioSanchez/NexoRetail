<form hx-post="{% url 'cambiar_estado_envio' envio.id %}" 
      hx-target="this" 
      hx-swap="outerHTML" 
      class="inline-block m-0">
    {% csrf_token %}
    <select name="estado" 
            onchange="this.form.dispatchEvent(new Event('submit'))"
            class="text-xs font-bold rounded-full px-3 py-1 outline-none border-0 cursor-pointer shadow-sm appearance-none
            {% if envio.estado == 'P' %}bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-400
            {% elif envio.estado == 'A' %}bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400
            {% elif envio.estado == 'C' %}bg-indigo-100 text-indigo-800 dark:bg-indigo-900/30 dark:text-indigo-400
            {% elif envio.estado == 'E' %}bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400
            {% else %}bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400{% endif %}">
        {% for value, label in estados %}
            <option value="{{ value }}" {% if envio.estado == value %}selected{% endif %}>
                {{ label }}
            </option>
        {% endfor %}
    </select>
</form>
