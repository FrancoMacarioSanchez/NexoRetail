{% extends 'base.html' %} {% block content %}
<div class="space-y-6">
  <div
    class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4"
  >
    <div>
      <h2
        class="text-2xl font-bold text-gray-800 dark:text-white transition-colors"
      >
        Historial de Ventas
      </h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
        Registro inmutable de facturas y remitos emitidos.
      </p>
    </div>
    <!-- Botón para ir al POS en caso de querer vender directamente -->
    <a
      href="{% url 'pos_presupuesto' %}"
      class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-sm font-bold hover:bg-emerald-700 transition-all shadow-md active:scale-95"
    >
      + Nueva Venta (POS)
    </a>
  </div>

  <!-- Buscador HTMX -->
  <!-- Reemplazar el formulario anterior por este: -->
<form id="form-filtros-ventas" 
      class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 transition-colors"
      hx-get="{% url 'ventas' %}" 
      hx-target="#tabla-cuerpo" 
      hx-trigger="input from:input delay:500ms, change from:select">
    
    <!-- Fila 1: Búsqueda Principal -->
    <div class="mb-4 flex gap-2">
        <div class="flex-1">
            <label class="sr-only">Buscar Venta</label>
            <input type="text" name="q" placeholder="Buscar por Cliente, Número de Venta o CAE..." value="{{ query }}"
                   class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-800 dark:text-white focus:ring-2 focus:ring-accent outline-none transition-colors">
        </div>
        <!-- Botón Limpiar -->
        <a href="{% url 'ventas' %}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 rounded-lg font-medium transition-colors whitespace-nowrap">
            Limpiar Filtros
        </a>
    </div>

    <!-- Fila 2: Filtros Avanzados -->
    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
        
        <!-- Fecha Desde -->
        <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Desde</label>
            <input type="date" name="fecha_desde" value="{{ fecha_desde }}" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-accent">
        </div>

        <!-- Fecha Hasta -->
        <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Hasta</label>
            <input type="date" name="fecha_hasta" value="{{ fecha_hasta }}" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-accent">
        </div>

        <!-- Cliente -->
        <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Cliente</label>
            <select name="cliente_id" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-accent">
                <option value="">Todos los clientes</option>
                {% for c in clientes %}
                    <option value="{{ c.id }}" {% if cliente_id == c.id|stringformat:"s" %}selected{% endif %}>{{ c.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Vendedor -->
        <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Vendedor</label>
            <select name="vendedor_id" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-accent">
                <option value="">Todos los vendedores</option>
                {% for v in vendedores %}
                    <option value="{{ v.id }}" {% if vendedor_id == v.id|stringformat:"s" %}selected{% endif %}>{{ v.username }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Estado de Envío -->
        <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">Logística</label>
            <select name="estado_envio" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-accent">
                <option value="">Todos los estados</option>
                <option value="SIN_ENVIO" {% if estado_envio == 'SIN_ENVIO' %}selected{% endif %}>Retira por Sucursal</option>
                {% for value, label in estados_envio %}
                    <option value="{{ value }}" {% if estado_envio == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

    </div>
</form>

  <!-- Tabla -->
  <div
    class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden transition-colors"
  >
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr
            class="bg-gray-50 dark:bg-gray-900/50 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider border-b border-gray-200 dark:border-gray-700"
          >
            <th class="px-6 py-4 font-medium">Fecha</th>
            <th class="px-6 py-4 font-medium">Comprobante</th>
            <th class="px-6 py-4 font-medium">Receptor</th>
            <th class="px-6 py-4 font-medium text-right">Total</th>
            <th class="px-6 py-4 font-medium text-center">Vendedor</th>
            <th class="px-6 py-4 font-medium text-center">Logística</th>
            <!-- NUEVA COLUMNA -->
            <th class="px-6 py-4 font-medium text-right">Acciones</th>
          </tr>
        </thead>
        <tbody
          id="tabla-cuerpo"
          class="divide-y divide-gray-100 dark:divide-gray-700"
        >
          {% include 'partials/tabla_ventas.html' %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
